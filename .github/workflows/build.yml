name: Build executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore Wemod-Patcher.sln

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild Wemod-Patcher.sln /p:Configuration=Release /p:RestorePackagesConfig=true

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Wand-Enhancer-v1.0.6.0
          path: |
            **/bin/Release/*.exe
            **/bin/Release/*.dll
